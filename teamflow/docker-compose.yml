services:
  db:
    image: postgres:15
    container_name: teamflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: teamflow_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: teamflow
    depends_on:
      - db

  # ✅ FIXED (inside services)
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://43.204.216.67:5000/api
    environment:
      NEXT_PUBLIC_API_URL: http://43.204.216.67:5000/api
    container_name: teamflow_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  teamflow_pgdata: